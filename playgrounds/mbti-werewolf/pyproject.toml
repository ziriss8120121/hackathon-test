[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mbti-werewolf"
version = "0.2.0"
description = "MBTI人狼AI先行テスト用シミュレーター"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbti_werewolf = [
    "agents/prompts/*/*.md",
    "agents/prompts/*/*.json",
    "judge/criteria/*/*.md",
    "judge/criteria/*/*.json",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
